[workspace]
resolver = "3"
members = ["func"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lyra-io/lyra-func"

[workspace.dependencies]
lyra-meta = { git = "https://github.com/lyra-io/lyra-meta", branch = "main" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
prost = "0.13"
prost-build = "0.13.5"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tonic = "0.13"
tonic-build = "0.13.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
