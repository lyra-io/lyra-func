name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Coverage (fail below 100% lines)
        id: coverage
        run: |
          if cargo llvm-cov --locked --all-features --fail-under-lines 100 --lcov --output-path target/lcov.info 2>target/cov.err; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
          elif grep -q "no coverage data found" target/cov.err; then
            echo "Workspace has no instrumented code yet; coverage gate passes vacuously."
            echo "has-coverage=false" >> "$GITHUB_OUTPUT"
          else
            cat target/cov.err >&2
            exit 1
          fi
      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has-coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: target/lcov.info
          fail_ci_if_error: true
